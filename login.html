<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barakah Travel & Tours | Staff Login</title>
<link rel="stylesheet" href="style.css">
<style>
.login-page{
  min-height:100vh;display:grid;place-items:center;
  background:linear-gradient(135deg,#eef6f3 0%,#f7f7f3 100%);padding:20px
}
.login-card{
  width:min(410px,100%);background:#fff;border:1px solid var(--border);
  border-radius:12px;padding:30px;box-shadow:0 8px 25px rgba(30,55,48,.08)
}
.login-brand{text-align:center;margin-bottom:24px}
.login-brand .brand-mark{margin:0 auto 10px}
.login-brand h1{font-size:22px;color:var(--green-dark)}
.login-brand p{font-size:12px;color:var(--muted);margin-top:5px}
.login-form{display:grid;gap:14px}
.login-form label{display:grid;gap:6px;font-size:11px;font-weight:800;color:#46534f}
.login-form input[type=text],.login-form input[type=password]{
  width:100%;padding:10px;border:1px solid #d6dfdb;border-radius:7px;outline:none
}
.login-form input:focus{border-color:var(--green)}
.remember{display:flex!important;grid-template-columns:auto 1fr;align-items:center;gap:7px;font-weight:400!important}
.remember input{width:auto}
.login-form button{width:100%;padding:11px}
.login-links{text-align:center;font-size:11px;margin-top:15px;color:var(--green);cursor:pointer}
.demo-note{
  background:#f5f8f6;border:1px solid var(--border);padding:10px;border-radius:7px;
  font-size:10px;line-height:1.4;color:var(--muted);margin-top:15px;text-align:center
}
</style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark">BT</div>
      <h1>Barakah Travel & Tours</h1>
      <p>Staff Umrah Management System</p>
    </div>
    <form class="login-form" onsubmit="event.preventDefault(); window.location.href='index.html';">
      <label>Email / Username
        <input type="text" placeholder="Enter your email or username" required>
      </label>
      <label>Password
        <input type="password" placeholder="Enter your password" required>
      </label>
      <label class="remember"><input type="checkbox"> Remember me</label>
      <button class="btn primary">Login</button>
    </form>
    <div class="login-links">Forgot Password?</div>
    <div class="demo-note">Student prototype only. Login is a front-end demonstration and does not use real authentication.</div>
  </div>
</div>
</body>
</html>
